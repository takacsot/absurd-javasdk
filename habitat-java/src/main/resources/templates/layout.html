<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content, activePage, pageTitle)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' — Absurd Habitat'">Absurd Habitat</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1a1a2e; line-height: 1.5; min-height: 100vh; }
        a { color: #2563eb; text-decoration: none; } a:hover { text-decoration: underline; }
        .header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
        .header-title { font-size: 0.875rem; font-weight: 600; }
        .nav { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .nav a { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; color: #6b7280; border: 1px solid transparent; }
        .nav a:hover { background: rgba(0,0,0,.04); text-decoration: none; color: #111; }
        .nav a.active { background: #fff; border-color: #e5e7eb; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-green { background: #10b981; } .dot-blue { background: #3b82f6; } .dot-purple { background: #8b5cf6; } .dot-amber { background: #f59e0b; }
        main { padding: 1.5rem; }
        .page-header { padding: 1.5rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .page-header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
        .page-header p { font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; overflow: hidden; }
        .card + .card { margin-top: 1rem; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid #f3f4f6; }
        .card-header h2 { font-size: 1rem; font-weight: 600; }
        .card-header p { font-size: 0.875rem; color: #6b7280; margin-top: 0.125rem; }
        .card-body { padding: 1rem 1.5rem; }
        .card-footer { padding: 0.75rem 1.5rem; border-top: 1px solid #f3f4f6; display: flex; gap: 1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem 1.25rem; }
        .stat-label { font-size: 0.75rem; color: #6b7280; }
        .stat-value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .stat-desc { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        thead th { text-align: left; font-size: 0.75rem; text-transform: uppercase; color: #6b7280; font-weight: 500; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; }
        tbody td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f3f4f6; }
        tbody tr:hover { background: rgba(0,0,0,.02); }
        .tabnum { font-variant-numeric: tabular-nums; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-running { background: #dbeafe; color: #1e40af; }
        .badge-sleeping { background: #e0e7ff; color: #3730a3; }
        .badge-completed { background: #d1fae5; color: #065f46; }
        .badge-failed { background: #fee2e2; color: #991b1b; }
        .badge-cancelled { background: #f3f4f6; color: #4b5563; }
        .text-muted { color: #6b7280; font-size: 0.75rem; }
        .empty { padding: 2rem; text-align: center; color: #9ca3af; border: 1px dashed #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; }
        .queue-card { border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem 1.25rem; }
        .queue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .stat-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.75rem 0; }
        .stat-mini { border: 1px solid #f3f4f6; border-radius: 0.375rem; padding: 0.5rem; }
        .stat-mini-label { font-size: 0.625rem; text-transform: uppercase; color: #9ca3af; }
        .stat-mini-value { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .event-card { border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 0.75rem; font-size: 0.875rem; }
        .event-card + .event-card { margin-top: 0.75rem; }
        .event-name { font-weight: 500; }
        .event-meta { font-size: 0.75rem; color: #6b7280; }
        .event-payload { margin-top: 0.5rem; background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 0.25rem; padding: 0.5rem; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
        .json-viewer { background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 0.25rem; padding: 0.5rem; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; margin-top: 0.5rem; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding: 0.5rem 0; }
        .btn { display: inline-block; padding: 0.375rem 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.375rem; font-size: 0.875rem; background: #fff; color: #111; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #f9fafb; text-decoration: none; }
        .btn-disabled { opacity: 0.5; pointer-events: none; }
        .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
        .filter-group label { display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem; }
        .filter-group select, .filter-group input { width: 100%; padding: 0.375rem 0.5rem; border: 1px solid #e5e7eb; border-radius: 0.375rem; font-size: 0.875rem; background: #fff; }
        .detail-section { margin-top: 0.75rem; }
        .detail-section h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        .detail-grid { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; font-size: 0.8125rem; }
        .detail-grid dt { color: #6b7280; } .detail-grid dd { font-weight: 500; }
    </style>
</head>
<body>
<div class="header">
    <span class="header-title">Absurd Habitat</span>
    <nav class="nav">
        <a th:href="'/'" th:classappend="${activePage == 'overview'} ? 'active'"><span class="dot dot-green"></span> Overview</a>
        <a th:href="'/tasks'" th:classappend="${activePage == 'tasks'} ? 'active'"><span class="dot dot-blue"></span> Tasks</a>
        <a th:href="'/events'" th:classappend="${activePage == 'events'} ? 'active'"><span class="dot dot-purple"></span> Events</a>
        <a th:href="'/queues'" th:classappend="${activePage == 'queues'} ? 'active'"><span class="dot dot-amber"></span> Queues</a>
    </nav>
</div>
<div th:replace="${content}">Page content</div>
</body>
</html>
