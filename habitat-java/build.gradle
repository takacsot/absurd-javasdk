plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'takacsot.absurd.habitat.HabitatApp'
}

group = 'takacso.absurd-java'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.absurd:absurd-sdk:0.3.0'
    implementation 'io.javalin:javalin:7.2.2'
    implementation 'io.javalin:javalin-rendering-thymeleaf:7.2.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.jdbi:jdbi3-core:3.45.4'
    implementation 'org.jdbi:jdbi3-jackson2:3.45.4'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.zaxxer:HikariCP:6.2.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Runs Habitat UI and an Absurd worker in one JVM'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'takacsot.absurd.habitat.CombinedDemo'
}